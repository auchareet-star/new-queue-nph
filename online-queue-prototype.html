<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ต้นแบบคิวออนไลน์ HA.OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: guided prototype styled after HA.OS itself — white portlets on #f2f3f8, black/grey controls, green #419700 accent.
   Patient screens copy the Mobile คิว app (soft green gradient, #016738); kiosk screens copy the Kiosk app (white, big type, green footer).
   Single light look on purpose, to match the real products. */
:root{
  color-scheme:light;
  --bg:#f2f3f8; --paper:#ffffff; --ink:#111111; --fg:#4d4d4d; --muted:#8a8f98; --line:#e8e8e8; --head:#ebebeb; --soft:#f6f7f9;
  --green:#419700; --green-soft:#eaf8e1; --green-pale:#f0f7eb; --green-call:#d8f0cf;
  --kgreen:#016738; --kgreen-soft:#e3f0e9; --mob-a:#E2E8DD; --mob-b:#F3F5F1; --mob-label:#7FA694;
  --ok:#419700; --ok-soft:#eaf8e1; --warn:#c77700; --warn-soft:#fff4e0; --bad:#e53935; --bad-soft:#fdecec; --info:#2b5aa8; --info-soft:#dbe7f7;
  --new:#7c3aed; --new-soft:#f1eafe; --mod:#c2410c; --mod-soft:#fdeee4; --reuse:#419700; --reuse-soft:#eaf8e1;
  --hl:#f59e0b; --hm:#000000; --hm-soft:#dedede; --hm-act:#a3a3a3; --hm-input:#000000; --hm-font-soft:#4b4b4b;
  --ch-online:#016738; --ch-kiosk:#1a7fa0; --ch-counter:#111111;
  --f:"Sarabun","Noto Sans Thai",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3,h4{margin:0;color:var(--ink);line-height:1.3;text-wrap:balance}
.app{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;min-height:100vh}
@media (max-width:1500px){.app{grid-template-columns:240px minmax(0,1fr)}.chg{grid-column:2}}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}.chg{grid-column:1}.nav{position:static!important;height:auto!important}}

/* ---------- prototype nav (white, HA.OS-like) ---------- */
.nav{background:var(--paper);border-right:1px solid var(--line);padding:16px 12px 24px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center}
.blogo{width:40px;height:40px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:7.5px;font-weight:700;flex-shrink:0;overflow:hidden}
.brand b{font-size:16px;color:var(--ink);display:block;line-height:1.2}
.brand span{font-size:12px;color:var(--muted)}
.ngrp{display:grid;gap:2px}
.ngrp h4{font-size:12.5px;font-weight:700;padding:6px 8px 2px;display:flex;gap:6px;align-items:center}
.ch{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:3px;padding:0 6px;line-height:18px}
.ch.c-online{background:var(--ch-online)}.ch.c-kiosk{background:var(--ch-kiosk)}.ch.c-counter{background:var(--ch-counter)}
.nb{background:none;border:0;text-align:left;padding:6px 8px;border-radius:4px;font-size:14px;color:var(--fg);display:flex;gap:8px;align-items:baseline}
.nb:hover{background:var(--soft)}
.nb.on{background:var(--green);color:#fff;font-weight:600}
.nb .k{font-size:12px;color:var(--muted);min-width:24px;font-weight:600}
.nb.on .k{color:#e6f5da}
.nav .sep{height:1px;background:var(--line)}
.nb.doc{font-weight:700;color:var(--mod)}
.nb.doc.on{background:var(--mod);color:#fff}

/* ---------- main + guide ---------- */
.main{display:grid;gap:14px;align-content:start;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px 16px;min-width:0}
.guide{background:var(--paper);border-radius:6px;border-left:6px solid var(--green);padding:12px 16px;display:grid;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.gh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gh b{font-size:17px;color:var(--ink)}
.gh .gstep{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
.guide p{margin:0;font-size:15.5px;line-height:1.6;color:var(--ink)}
.guide p b{color:var(--green)}
.gbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex:1;min-width:120px}
.dots i{height:5px;flex:1;border-radius:3px;background:#e3e3e3}
.dots i.done{background:#a6cf86}.dots i.now{background:var(--green)}
.gb{border:1px solid #bbb;background:#fff;border-radius:4px;padding:5px 14px;font-size:14px}
.gb.primary{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
.samples{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.samples span{background:var(--soft);border-radius:4px;padding:1px 8px}
.stage{min-width:0;display:grid;justify-items:center;gap:6px}
.stage-label{justify-self:start;font-size:13px;font-weight:600;color:var(--muted)}
.hl{outline:3px solid var(--hl)!important;outline-offset:3px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.55)}50%{box-shadow:0 0 0 8px rgba(245,158,11,0)}}
@media (prefers-reduced-motion:reduce){.hl{animation:none}}

/* ---------- right panel ---------- */
.chg{background:var(--paper);border-left:1px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) 30px 16px;display:grid;gap:12px;align-content:start}
@media (max-width:1500px){.chg{margin:0 16px 30px;border-radius:6px;border:1px solid var(--line)}}
.chg h3{font-size:16px}
.chg .sub{font-size:12.5px;color:var(--muted);margin-top:-6px}
.ci{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.55;align-items:start}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.new{background:var(--new-soft);color:var(--new)}.pill.mod{background:var(--mod-soft);color:var(--mod)}.pill.reuse{background:var(--reuse-soft);color:var(--reuse)}
.legend{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- Mobile คิว (patient) ---------- */
.phone{width:370px;max-width:100%;background:#1c1f24;border-radius:38px;padding:11px;box-shadow:0 14px 40px rgba(0,0,0,.18)}
.scr{background:#fff;border-radius:28px;overflow:hidden;min-height:660px;display:flex;flex-direction:column;color:#4D4D4D}
.mh{padding:18px 16px 10px;display:flex;gap:10px;align-items:center}
.mlogo{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--kgreen);display:grid;place-items:center;color:var(--kgreen);font-weight:800;font-size:11px;flex-shrink:0}
.mh b{display:block;font-size:16.5px;color:var(--kgreen)}
.mh span{font-size:12.5px;color:#7FA694}
.mback{background:#fff;border:0;color:var(--kgreen);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.mb{padding:14px 14px 18px;display:grid;gap:12px;align-content:start;flex:1;position:relative}
.mb::before{content:"";position:absolute;left:0;right:0;top:0;height:230px;background:#F3F5F1;border-radius:0 0 50px 50px}
.mb>*{position:relative}
.mnav{background:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 4px rgba(0,0,0,.2);position:relative;z-index:1}
.mnav .mlogo{width:44px;height:44px}
.mnav div b{display:block;font-size:18px;font-weight:600;color:var(--kgreen);line-height:1.2}
.mnav div span{display:block;font-size:12px;font-weight:700;color:var(--kgreen);letter-spacing:.02em}
.mtitle{display:flex;gap:10px;align-items:center}
.mtitle b{display:block;font-size:20px;font-weight:500;color:var(--kgreen);line-height:1.25}
.mtitle span{display:block;font-size:14px;color:#7FA694}
.mfoot{font-size:11px;color:#7FA694;text-align:center;padding:8px}
.mcard{background:#fff;border-radius:5px 15px 15px 15px;padding:13px 18px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.mcard h4{font-size:18px;font-weight:500;color:var(--kgreen)}
.fl{display:grid;gap:3px}
.fl label,.lab{font-size:14px;color:var(--mob-label)}
.r{color:var(--bad)}
.in{width:100%;border:1px solid #cfd8cf;border-radius:8px;padding:7px 10px;background:#fff;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #cfd8cf;background:#fff;border-radius:999px;padding:3px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--kgreen);border-color:var(--kgreen);color:#fff}
.mbtn{border:0;border-radius:100px;min-height:48px;padding:10px 16px;font-weight:600;background:var(--kgreen);color:#fff;font-size:16px;width:100%;box-shadow:0 0 15px rgba(0,0,0,.15)}
.mbtn:active{background:#1a4f36}
.mbtn.ghost{background:#fff;color:var(--kgreen);border:1px solid var(--kgreen)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:0;border-radius:16px;padding:12px;text-align:left;display:grid;gap:3px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tile b{font-size:14.5px;color:var(--kgreen)}
.tile span{font-size:12px;color:#7FA694;line-height:1.45}
.tile[disabled]{opacity:.55;cursor:default}
.refbox{background:#fff;border-radius:5px 15px 15px 15px;padding:16px;text-align:center;display:grid;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.refbox .no{font-size:32px;font-weight:600;color:var(--kgreen);letter-spacing:.02em}
.refbox .lab{color:#7FA694}
.msg{border-radius:10px;padding:9px 12px;font-size:13.5px}
.msg.err{background:var(--bad-soft);color:var(--bad)}.msg.info{background:var(--info-soft);color:var(--info)}.msg.ok{background:var(--ok-soft);color:#2f6e00}.msg.warn{background:var(--warn-soft);color:var(--warn)}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px;font-size:13.5px}
.kv span:first-child{color:var(--muted)}
.mcard .kv{font-size:15px}
.mcard .kv span:first-child{color:#4D4D4D;font-weight:600}
.st{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st.wait{background:var(--warn-soft);color:var(--warn)}.st.ok{background:var(--ok-soft);color:var(--ok)}.st.bad{background:var(--bad-soft);color:var(--bad)}.st.mute{background:#eee;color:#777}.st.info{background:var(--info-soft);color:var(--info)}
.chat{flex:1;padding:14px;display:grid;gap:10px;align-content:start}
.bubble{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bubble .bh{background:var(--kgreen);color:#fff;padding:10px 12px;font-weight:700}
.bubble .bb{padding:10px 12px;display:grid;gap:6px;font-size:13.5px}

/* ---------- HA.OS staff shell ---------- */
/* theme tokens come from _config-custom-ehr.scss: ehr-13 (ดำ) by default, ehr-4 (เขียว, default for hospCode 10679) via the toggle */
:root[data-ht="green"]{--hm:#13A709; --hm-soft:#D8F5D6; --hm-act:#088800; --hm-input:#77B873; --hm-font-soft:#77B873}
.haos{width:100%;max-width:1240px;background:#f3f3f3;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:grid;grid-template-columns:230px minmax(0,1fr);font-size:13px;font-weight:300;color:#4d4d4d;min-height:640px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
@media (max-width:1000px){.haos{grid-template-columns:minmax(0,1fr)}.hside{display:none!important}}
.hside{background:var(--hm);color:#fff;display:flex;flex-direction:column;padding-bottom:16px}
.hbrand{display:flex;align-items:center;gap:10px;padding:0 16px;height:65px;font-size:16px;font-weight:400}
.hbrand .tg{margin-left:auto;opacity:.8;font-size:15px}
.hlogo{width:36px;height:36px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:8px;font-weight:700}
.hgrp{padding:20px 25px 6px;font-size:12px;font-weight:500;letter-spacing:.3px;color:rgba(255,255,255,.75)}
.hm{background:none;border:0;color:#fff;text-align:left;padding:9px 25px;min-height:44px;font-size:13px;font-weight:400;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hm:hover,.hm.on{background:var(--hm-act)}
.hmain{display:flex;flex-direction:column;min-width:0}
.htop{background:#fefefe;box-shadow:0 0 40px rgba(82,63,105,.1);min-height:65px;padding:8px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:#999;position:relative;z-index:1}
.htop .hsel,.htop .srch{border:1px solid var(--hm-input);border-radius:4px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.1);height:38px;display:flex;align-items:center;padding:0 10px}
.htop .hsel{width:84px;justify-content:space-between;color:#4d4d4d}
.htop .srch{width:320px;max-width:100%;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden;font-size:13px}
.cardicon{display:inline-grid;place-items:center;width:60px;height:38px;border-radius:4px;background:var(--hm-soft);color:var(--hm);font-size:12px;font-weight:700}
.htop .ticons{margin-left:auto;display:flex;gap:14px;color:#6e7899}
.htop .ticons svg{width:20px;height:20px;display:block}
.htop .usr{text-align:right;line-height:1.3;color:#6b7594;font-size:13px}
.htop .usr b{color:#4d4d4d;font-weight:500}
.htop .ava{width:38px;height:38px;border-radius:50%;background:#e8ecef;display:grid;place-items:center;color:#8a8f98;font-weight:600}
.hsub{background:#fff;box-shadow:0 10px 30px rgba(82,63,105,.08);min-height:54px;padding:8px 25px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hsub h1{font-size:21px;font-weight:500;color:var(--hm)}
.hsub .cr{font-size:15.5px;font-weight:500;color:var(--hm-font-soft);display:flex;gap:8px;align-items:center}
.hsub .dot{font-size:24px;line-height:1}
.hct{padding:20px 25px 25px;display:grid;gap:20px;min-width:0}
.port{background:#fff;border-radius:4px;padding:25px;box-shadow:0 0 13px rgba(82,63,105,.05);min-width:0;display:grid;gap:12px;align-content:start}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ph2 h2{font-size:18px;font-weight:500;color:var(--hm)}
.haos .hdl{font-size:24px;font-weight:700;color:#4d4d4d}
.haos .clock{font-size:18px;font-weight:700;color:#A6BB98}
.tabs{display:flex;gap:20px;flex-wrap:wrap}
.tabs{border-bottom:1px solid #ebedf2;flex-wrap:nowrap!important;overflow-x:auto;gap:18px!important}
.tab{white-space:nowrap;flex-shrink:0}
.tab{background:none;border:0;padding:8px 0;margin-bottom:-1px;border-bottom:5px solid transparent;font-size:16px;font-weight:600;display:flex;gap:6px;align-items:center;color:var(--hm)}
.tab:hover{border-bottom-color:var(--hm-act)}
.tab.on{color:#419700;border-bottom-color:var(--hm-act)}
.badge{background:#a6bb98;color:#fff;border-radius:10rem;font-size:12px;padding:1px .8em;font-weight:600}
.tab.on .badge{background:#419700}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--head);color:var(--ink);font-weight:600;padding:10px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid #ddd}
td{padding:10px;border-bottom:1px solid #eee;vertical-align:middle}
.haos table{font-size:15px}
.haos th{background:var(--hm-soft);color:var(--hm);font-size:16px;font-weight:500;line-height:20px;border-bottom:0}
.haos td{font-weight:400;border-bottom:1px solid #ebedf2}
.haos tbody tr:nth-child(even) td{background:#f8fafb}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#fafcf8}
tr.sel td{background:var(--green-pale)}
tr.grp td{background:var(--green-soft);font-weight:600;color:var(--ink)}
tr.g-blue td{background:#DDE8FA!important;color:#2f70a1;font-weight:700;font-size:16px;padding:8px 10px}
.b{border:0;border-radius:3px;padding:7px 14px;font-size:14px;white-space:nowrap}
.b.green{background:var(--green);color:#fff}.b.black{background:#111;color:#fff;font-weight:600}.b.out{background:#fff;border:1px solid #ccc;color:#333}.b.red{background:var(--bad);color:#fff}.b.blue{background:#3b82f6;color:#fff}.b.violet{background:#a07ce6;color:#fff}.b.grey{background:#ececec;color:#aaa}
.b[disabled]{opacity:.4;cursor:not-allowed}
/* HA.OS mat-raised-button colors: btn-save = theme main, basic = white + main border, btn-view-4 = soft */
.haos .b{border-radius:4px;font-size:15px;font-weight:300;letter-spacing:.35px;padding:7px 16px}
.haos .b.green{background:var(--hm);color:#fff;font-weight:400}
.haos .b.out{background:#fff;border:1px solid var(--hm);color:var(--hm);border-radius:5px}
.haos .b.black{background:var(--hm-soft);color:var(--hm);font-weight:500}
.haos .b.red{background:#fff1f7;color:#fe4d97}.haos .b.blue{background:#f1f6fd;color:#4a90e2}.haos .b.grey{background:#e8ecef;color:#4d4d4d}
.haos .in{border:1px solid var(--hm-input);border-radius:4px;min-height:41px;font-size:14px;color:#495057}
.haos .frm .in{border-color:var(--hm-input)}
.haos .fl label,.haos .frm .fl label{color:var(--hm);font-size:14px;font-weight:400}
.haos .seg button.on{background:var(--hm)}
.haos .stepno{background:var(--hm)}
.themebar{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.themebar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font-size:12.5px}
.themebar button[aria-pressed="true"]{background:#111;color:#fff;border-color:#111}
.themebar button.g[aria-pressed="true"]{background:#13A709;border-color:#13A709}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px;align-items:start}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.box h3{font-size:15.5px}
.lblg{color:var(--green);font-size:18px;font-weight:600}
.tagn{display:inline-block;font-size:10.5px;font-weight:700;border-radius:3px;padding:0 5px;vertical-align:middle;white-space:nowrap}
.tagn.new{background:var(--new-soft);color:var(--new);border:1px solid #d9c6fb}
.tagn.mod{background:var(--mod-soft);color:var(--mod);border:1px solid #f5c9ad}
.hside .tagn.new{background:#5b21b6;color:#fff;border-color:#5b21b6}
.hside .tagn.mod{background:#9a3412;color:#fff;border-color:#9a3412}
.src{font-size:11.5px;font-weight:700;color:var(--mod);background:var(--mod-soft);border-radius:3px;padding:0 6px;margin-left:6px;white-space:nowrap}
.big{font:700 44px/1 var(--f)}
.tl{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:4px;font-weight:800;color:#fff}
.tl.V{background:var(--ok)}.tl.P{background:var(--bad)}.tl.N{background:var(--warn)}
.sugg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;border-radius:6px;padding:12px}
.sugg.V{background:var(--ok-soft)}.sugg.P{background:var(--bad-soft)}.sugg.N{background:var(--warn-soft)}.sugg.X{background:var(--bad-soft)}
.sugg.V .big{color:var(--ok)}.sugg.P .big{color:var(--bad)}.sugg.N .big{color:var(--warn)}.sugg.X .big{color:var(--bad)}
.tkt{border:2px dashed #999;border-radius:6px;padding:12px 14px;display:grid;gap:3px;background:#fff;max-width:300px;font-size:13.5px}
.tkt .tno{font:700 34px/1.1 var(--f);letter-spacing:.03em}

const CHANNELS = [["counter","Counter · เวชระเบียน"],["online","Online · มือถือ"]];
function openApptVisit(){
  const a = db.appts.find(x => x.id === "AP-501"), pt = db.patients.find(x => x.cid === a.cid);
  if (a.visited) return;
  a.visited = true;
  const ci = db.checkins[a.id];
  const v = {q:a.clinic + "-A" + pad(++db.n.vq), hn:pt.hn, name:pname(pt), type:"นัด", clinic:a.clinic, appt:a.id, vs:ci ? {...ci} : null, pri:"N", allergy:pt.allergy};
  if (ci) ci.bound = v.q;  // AddVisitFormAppointment: vitals saved into the visit right after it is created
  db.visits.push(v); db.last.visit = v.q;
}

}
function recalcLimit(c){

  const sum = k => on.some(r => r[k] == null || r[k] === "") ? null : on.reduce((t, r) => t + Number(r[k]), 0);

}

}

  if (a === "back"){ p.view = "list"; return rerender(); }
  const g = db.regs.find(x => x.ref === p.sel); if (!g) return;
  const keep = () => Object.assign(g, {title:val("g-title"), first:val("g-first"), last:val("g-last"), sex:val("g-sex"), cid:digits(val("g-cid")), dob:val("g-dob"), nat:val("g-nat"), phone:val("g-phone"), hno:val("g-hno"), moo:val("g-moo"), tambon:val("g-tam"), amphoe:val("g-amp"), province:val("g-prov"), zip:val("g-zip"), cname:val("g-cname"), crel:val("g-crel"), cphone:val("g-cphone"), religion:val("g-rel"), job:val("g-job"), allergy:val("g-alg")});
  db.last.reg = g.ref;
  if (a === "save"){ keep(); rerender(); return toast("บันทึกการแก้ไขแล้ว"); }
  if (a === "reject"){ g.status = "ปฏิเสธ"; g.reason = val("rr-why"); sendResult(g); rerender(); toast(`ปฏิเสธแล้ว · ส่งแจ้งผล${g.sent}`); return emit("rr:reject"); }
  if (a === "merge"){ keep(); const old = db.patients.find(x => x.hn === el.dataset.hn); old.cid = g.cid; old.phone = g.phone; old.legacy = false; g.status = "ใช้ HN เดิม"; g.hn = old.hn; sendResult(g); rerender(); toast(`ใช้ HN เดิม ${old.hn} · ส่งแจ้งผล${g.sent}`); return emit("rr:merge"); }
  if (a !== "confirm") return;
  keep();
  const pt = newPatientFrom(g); g.status = "ออก HN แล้ว"; g.hn = pt.hn; sendResult(g);
  rerender(); toast(`สร้าง HN ${pt.hn} แล้ว (AddPatient) · ส่งแจ้งผล${g.sent}`); emit("rr:confirm");
 }};

 }};

SCR["m-checkin"] = {kind:"phone", label:"Online · เช็กอินออนไลน์", render(){
  const p = P(), a = p.token ? db.appts.find(x => x.id === p.token) : null;
  if (!a){
    const who = anyPerson(sample()) || {};
    return phone("เช็กอินออนไลน์", "สำหรับผู้ที่มีนัด", `<div class="msg info">ไม่ได้รับลิงก์? ยืนยันตัวด้วยเลขบัตร + วันเกิด</div><div class="mcard">${fl("f-cid","เลขบัตรประชาชน",fmtCid(who.cid),1)}${fl("f-dob","วันเกิด",who.dob,1)}</div>
      ${p.err ? `<div class="msg err">${p.err}</div>` : ""}<button type="button" class="mbtn" data-act="find">ค้นหานัด</button>`);
  }
  const pt = db.patients.find(x => x.cid === a.cid), ci = db.checkins[a.id] || {}, sym = p.sym || ci.sym;
  if (a.visited) return phone("เช็กอินออนไลน์", "ก่อนพบแพทย์", `<div class="msg ok">เปิด Visit ของนัดนี้แล้ว ข้อมูลถูกบันทึกเข้า Visit แล้ว จึงแก้ไขไม่ได้</div>`);
  const rad = (name, opts, v) => `<div class="rad">${opts.map(o => `<label><input type="radio" name="${name}" value="${o}" ${o === v ? "checked" : ""}> ${o}</label>`).join("")}</div>`;
  const form = !sym ? "" : `
    <div class="mcard"><h4>อาการวันนี้เป็นอย่างไร <span class="r">*</span></h4><textarea class="in" id="f-cc" style="min-height:60px" placeholder="เช่น อาการปกติ ทานยาตามแพทย์สั่ง">${esc(ci.cc || (sym === "abn" ? "เวียนศีรษะ 2 วัน ความดันที่บ้านสูงกว่าปกติ" : "อาการปกติ ทานยาตามแพทย์สั่ง"))}</textarea></div>
    <div class="mcard"><h4>สะดวกเดินทางมาโรงพยาบาลหรือไม่ <span class="r">*</span></h4>${rad("f-travel", ["สะดวก","ไม่สะดวก"], ci.travel || "สะดวก")}
      <span class="lab">ถ้าไม่สะดวก แจ้งเลื่อนนัดได้</span><button type="button" class="mbtn ghost" data-go="m-resched" data-p='{"token":"${a.id}"}' style="min-height:38px;font-size:14px">แจ้งความประสงค์เลื่อนนัด</button></div>
    <div class="mcard"><h4>มีแพ้ยาใหม่หรือไม่ <span class="r">*</span></h4><div style="background:#F3F5F1;border-radius:8px;padding:6px 10px;font-size:13.5px"><span class="lab">รายการแพ้ยาที่โรงพยาบาล</span><br><b>${esc(pt.allergy || "-")}</b></div>
      ${rad("f-newalg", ["ไม่มีแพ้ยาใหม่","มีแพ้ยาใหม่"], ci.newAlg ? "มีแพ้ยาใหม่" : "ไม่มีแพ้ยาใหม่")}<input class="in" id="f-newalgtxt" placeholder="ชื่อยาที่แพ้ / อาการ" value="${esc(ci.newAlgTxt || "")}"></div>
    <div class="mcard"><h4>สัญญาณชีพ</h4>
      <div class="row2">${fl("f-sys","ความดันตัวบน (SYS)",ci.sys || "128",1)}${fl("f-dia","ความดันตัวล่าง (DIA)",ci.dia || "82",1)}</div>
      ${fl("f-pr","ชีพจร (ครั้ง/นาที)",ci.pr || "78",1)}
      <span class="lab">ไม่บังคับ</span>
      <div class="row2">${fl("f-wt","น้ำหนัก (กก.)",ci.wt || "72")}${fl("f-ht","ส่วนสูง (ซม.)",ci.ht || "168")}</div>
      <div class="row2">${fl("f-temp","อุณหภูมิ (°C)",ci.temp || "")}<div class="fl"><label for="f-wdate">วันที่วัด</label><input class="in" type="date" id="f-wdate" value="${ci.wdate || "2026-10-15"}"></div></div>
      <div class="row2"><div class="fl"><label for="f-wtime">เวลาที่วัด</label><input class="in" type="time" id="f-wtime" value="${ci.wtime || "19:30"}"></div><div></div></div></div>
    <div class="mcard"><h4>ข้อมูลเพิ่มเติม (ไม่บังคับ)</h4>${fl("f-phone","เบอร์โทรที่ติดต่อได้",ci.phone || pt.phone)}
      <span class="lab">สูบบุหรี่</span>${rad("f-smoke", ["ไม่สูบ","สูบ"], ci.smoke)}<span class="lab">ดื่มสุรา</span>${rad("f-alc", ["ไม่ดื่ม","ดื่ม"], ci.alc)}</div>
    ${p.err ? `<div class="msg err">${p.err}</div>` : ""}
    <button type="button" class="mbtn" id="f-submit" data-act="ask">เช็กอิน</button>`;
  const body = `
    <div class="mcard"><h4>ข้อมูลการนัดหมาย</h4><div class="kv"><span>HN</span><b>${pt.hn}</b></div><div class="kv"><span>ชื่อ-สกุล</span><span>${pname(pt)}</span></div><div class="kv"><span>วันนัด</span><span>${a.date} ${a.time} น.</span></div><div class="kv"><span>คลินิก</span><span>${cl(a.clinic).name}</span></div><div class="kv"><span>แพทย์</span><span>${a.doctor}</span></div>
      <span class="lab">เหตุผลการนัด</span><div class="rchips">${(a.reasons || [a.reason]).map(r => `<span class="rchip">${r}</span>`).join("")}</div></div>
    ${db.checkins[a.id] ? `<div class="msg info">ส่งข้อมูลไว้แล้วเมื่อ ${ci.at} แก้ไขได้จนกว่าจะเปิด Visit</div>` : ""}
    <div class="symb"><button type="button" class="n" id="ci-normal" data-act="sym" data-v="normal" aria-pressed="${sym !== "abn"}">อาการปกติ</button><button type="button" class="x" id="ci-abn" data-act="sym" data-v="abn" aria-pressed="${sym !== "normal"}">อาการผิดปกติ</button></div>
    ${sym ? "" : `<span class="lab">กรุณาเลือก แล้วตอบแบบสอบถามให้ครบ เพื่อใช้ซักประวัติ</span>`}
    ${form}
    ${p.ask ? `<div class="mmodal"><div class="box2"><b style="font-size:18px">ยืนยันการเช็กอิน</b><span style="font-size:13.5px">ข้อมูลจะส่งให้โรงพยาบาล และเข้า Visit ตอนเปิด Visit นัด</span><div class="row2"><button type="button" class="mbtn ghost" data-act="cancel">ยกเลิก</button><button type="button" class="mbtn" id="ci-ok" data-act="submit">บันทึก</button></div></div></div>` : ""}`;
  return phone("เช็กอินออนไลน์", "ก่อนพบแพทย์", body);
 },
 act(a, el){
  const p = P();
  if (a === "find"){ const pt = findPt(val("f-cid"), val("f-dob")); const ap = pt && db.appts.find(x => x.cid === pt.cid && !x.visited); if (!ap){ p.err = "ไม่พบนัดของวันนี้หรือพรุ่งนี้"; return rerender(); } p.token = ap.id; p.err = ""; return rerender(); }
  if (a === "sym"){ p.sym = el.dataset.v; p.err = ""; rerender(); return emit("ci:sym"); }
  if (a === "cancel"){ p.ask = false; return rerender(); }
  const radio = n => document.querySelector(`input[name="${n}"]:checked`)?.value || "";
  if (a === "ask"){
    if (!val("f-cc")){ p.err = "กรุณากรอกอาการวันนี้"; return rerender(); }
    if (!val("f-sys") || !val("f-dia") || !val("f-pr")){ p.err = "กรุณากรอกความดันและชีพจร"; return rerender(); }
    if (radio("f-newalg") === "มีแพ้ยาใหม่" && !val("f-newalgtxt")){ p.err = "กรุณาระบุยาที่แพ้"; return rerender(); }
    const d = val("f-wdate"), [y, m, dd] = d ? d.split("-") : [];
    p.draft = {sym:p.sym, cc:val("f-cc"), travel:radio("f-travel"), newAlg:radio("f-newalg") === "มีแพ้ยาใหม่", newAlgTxt:val("f-newalgtxt"), sys:val("f-sys"), dia:val("f-dia"), pr:val("f-pr"), wt:val("f-wt"), ht:val("f-ht"), temp:val("f-temp"),
      wdate:d, wtime:val("f-wtime"), when:d ? `${dd}/${m}/${+y + 543}${val("f-wtime") ? " " + val("f-wtime") + " น." : ""}` : "", phone:val("f-phone"), smoke:radio("f-smoke"), alc:radio("f-alc")};
    p.err = ""; p.ask = true; rerender(); return emit("ci:ask");
  }
  if (a !== "submit") return;
  db.checkins[p.token] = {...p.draft, at:nowStr()};
  navigate("m-checkin-done", {token:p.token}); emit("ci:submit");
 }};

SCR["m-checkin-done"] = {kind:"phone", label:"Online · เช็กอินสำเร็จ", render(){
  const ci = db.checkins[P().token] || {};
  return phone("เช็กอินสำเร็จ", "โรงพยาบาลได้รับข้อมูลของท่านแล้ว", `<div class="refbox"><span class="no">✓</span><span>BP ${ci.sys}/${ci.dia} · PR ${ci.pr}${ci.sym === "abn" ? " · แจ้งอาการผิดปกติ" : ""}</span></div>
    <div class="mcard"><h4>ขั้นตอนการรับบริการ</h4><ol style="margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px"><li>เปิด Visit นัดที่ตู้ Kiosk หรือเคาน์เตอร์ ก่อนเวลานัด 30 นาที</li><li>ข้อมูลที่กรอกจะเข้า Visit ให้เอง ไม่ต้องกรอกซ้ำ</li><li>${ci.sym === "abn" ? "<b>ติดต่อเคาน์เตอร์พยาบาลในแผนกที่มีนัด พร้อมแจ้งว่าเช็กอินแล้ว มีอาการผิดปกติ</b>" : "รอเรียกที่จุดคัดกรอง"}</li></ol></div>
    <button type="button" class="mbtn ghost" data-go="m-checkin" data-p='{"token":"${P().token}"}'>แก้ไขข้อมูล</button>`);
}};

SCR["m-resched"] = {kind:"phone", label:"Online · แจ้งความประสงค์เลื่อนนัด", render(){
  const p = P(), a = db.appts.find(x => x.id === (p.token || "AP-501")), pt = db.patients.find(x => x.cid === a.cid);
  return phone("แจ้งความประสงค์เลื่อนนัด", "เจ้าหน้าที่จะเลื่อนให้ตามตารางที่ว่าง", `
    <div class="mcard"><h4>นัดเดิม</h4><div class="kv"><span>เลขที่นัด</span><b>${a.no || a.id}</b></div><div class="kv"><span>วันนัด</span><span>${a.date} ${a.time} น.</span></div><div class="kv"><span>คลินิก</span><span>${cl(a.clinic).name}</span></div><div class="kv"><span>แพทย์</span><span>${a.doctor}</span></div></div>
    <div class="mcard"><div class="fl"><label for="f-why">เหตุผล <span class="r">*</span></label><select class="in" id="f-why"><option>ไม่สะดวกเดินทาง</option><option>ติดธุระ / ติดงาน</option><option>เจ็บป่วย มาไม่ได้</option><option>อื่น ๆ</option></select></div>
      ${daysPicker(["จ.","พ."], "20/10/2569", "31/10/2569")}${fl("f-phone","เบอร์ติดต่อกลับ",pt.phone,1)}</div>
    ${p.err ? `<div class="msg err">${p.err}</div>` : ""}
    <button type="button" class="mbtn" id="f-submit" data-act="submit">ส่งคำขอเลื่อนนัด</button>`);
 },
 act(a, el){
  const p = P();
  if (a === "chip"){ el.setAttribute("aria-pressed", el.getAttribute("aria-pressed") === "true" ? "false" : "true"); return; }
  if (a !== "submit") return;
  const ap = db.appts.find(x => x.id === (p.token || "AP-501")), pt = db.patients.find(x => x.cid === ap.cid), d = readDays();
  if (!d.days.length && !d.other){ p.err = "กรุณาเลือกวันที่มาได้"; return rerender(); }
  const r = newReq(pt, {kind:"เลื่อนนัด", oldAppt:ap.id, clinic:ap.clinic, ...d, phone:val("f-phone"), symptom:"ขอเลื่อนนัด: " + val("f-why"), chronic:"", doctor:ap.doctor, attach:0});
  navigate("m-request-done", {ref:r.ref}); emit("resched:submit");
 }};

SCR["m-notify"] = {kind:"phone", label:"Online · แจ้งผลทำบัตรทางหมอพร้อม (จำลอง)", render(){
  let head = "", body = "";
  {
    const g = db.regs.find(x => x.ref === db.last.reg) || db.regs[db.regs.length - 1];
    head = g.status === "ปฏิเสธ" ? "ผลการลงทะเบียนทำบัตร" : "ลงทะเบียนทำบัตรสำเร็จ";
    body = g.status === "ปฏิเสธ" ? `<div class="kv"><span>เลขอ้างอิง</span><b>${g.ref}</b></div><div class="msg err">ไม่สามารถลงทะเบียนได้: ${g.reason}</div><span style="font-size:12.5px">ติดต่อเวชระเบียน โทร 0-0000-0000</span>`
      : `<div class="kv"><span>ชื่อ</span><span>${g.title} ${g.first} ${g.last}</span></div><div class="kv"><span>HN</span><b style="font-size:20px">${g.hn}</b></div>${g.status === "ใช้ HN เดิม" ? '<span style="font-size:12.5px">ท่านมีประวัติที่โรงพยาบาลอยู่แล้ว ใช้ HN นี้ได้เลย</span>' : ""}<span style="font-size:12.5px">ครั้งแรกที่มา กรุณานำบัตรประชาชนตัวจริงมายืนยันตัวตนที่เวชระเบียน</span>`;
  }
  return `<div class="phone"><div class="scr"><div class="mh"><span class="mlogo">รพ.</span><div><b>แจ้งผล</b><span>จำลอง · ช่องทางจริงคือหมอพร้อม (IT ดูแล)</span></div></div>
    <div class="chat"><div class="bubble"><div class="bh">${head} · ${HOSP}</div><div class="bb">${body}</div></div></div><div class="mfoot">ส่งตามเลขบัตรประชาชนทางหมอพร้อม · คนไข้ไม่ต้องมีลิงก์</div></div></div>`;
}};

      ["ทะเบียนประวัติ / เปิด Visit (หน้าเดิม)","ไม่แก้ ช่องเวชระเบียนใช้ตามปกติ","เดิม"],
      ["เรียกคิวคัดแยก/ซักประวัติ","แก้เล็กน้อย: ป้ายอาการผิดปกติ / แพ้ยาใหม่ / กลุ่มคิว และเรียงกลุ่มด่วนก่อน · Vital Sign และ CC มาจาก Visit แล้ว","แก้"]]],
    ["WebAPI / ฐานข้อมูล", [
      ["ตารางใหม่","ชุดคลินิกต่อจุดออกบัตร (ไม่มีตารางบัตรคิว), คำขอทำบัตร, คำขอนัด + ไฟล์แนบ, โทเคนนัด, ข้อมูลเช็กอิน (Vital Sign)","ใหม่"],
      ["Controller สาธารณะ","แยกจาก KioskController: AllowAnonymous + ยืนยันเลขบัตร/วันเกิด + จำกัดจำนวนครั้ง","ใหม่"],
      ["สเปก Limit ห้องตรวจ","Dashboard อ่านยอดระดับคลินิกจาก Limit ชุดเดียวกัน และนับเฉพาะจุดที่มีแพทย์ออกตรวจวันนี้","แก้"],
      ["เมนูสรุปจุดบริการ (ใหม่ · สเปก Limit)","ตั้ง Limit Walk-in ต่อจุด · Limit นัดอ่านจาก LimitCase ของตารางแพทย์ · ค่ารวมส่งไปที่ Dashboard จุดออกบัตร","ใหม่"],
      ["AddVisit (Walk-in)","ไม่แก้ · Dashboard ไม่ได้นับจาก Visit แต่นับ Walk-in ที่เรียกเข้าห้องตรวจแล้วจากคิวห้องตรวจ (ยอดชุดเดียวกับสรุปจุดบริการ)","เดิม"],
      ["PrivilegeService.AddVisitFormAppointment","เปิด Visit นัดสำเร็จแล้ว ถ้ามีข้อมูลเช็กอินของนัดนั้น บันทึกเข้า TB_VITAL_SIGNS ของ Visit (วิธีเดียวกับ VitalSignsPublicService.AddVitalSigns) · ใช้ทั้งตู้ Kiosk และเคาน์เตอร์ โดยหน้าจอไม่แก้","แก้"],
      ["AppointmentService","สร้างโทเคนต่อนัด · เลื่อน/ยกเลิก = โทเคนใช้ไม่ได้","แก้"],
      ["RegisterService.AddPatient / CheckDuplicateIdcardPatient","ใช้ตามเดิมจากคำขอทำบัตรออนไลน์","เดิม"]]],
    ["Kiosk", [
      ["ตู้ Kiosk","เปิด Visit ได้เฉพาะนัดหมาย · ปิดทาง Walk-in (เลือกประเภท Walk-in / เลือกห้องตรวจ) ไม่มีนัดวันนี้ = แจ้งให้ไปจุดออกบัตรคิว Walk-in · ตอนเปิด Visit นัด API นำข้อมูลเช็กอินเข้า Visit ให้เอง","แก้"]]],
    ["Online", [
      ["แอป Mobile คิว","เพิ่ม Route ทำบัตร (หน้ากลาง → ลงทะเบียน / ตรวจสอบ HN), ขอนัด, เช็กอิน ไม่มีหน้าหลัก ไม่มีหน้าตรวจสถานะ แต่ละหน้าเข้าจากลิงก์/QR ของตัวเอง · ใช้ Layout เดิม ไม่ต้อง Login · หน้าติดตามคิวเดิมไม่แตะ","แก้"],
      ["Proxy ของ Mobile คิว","เปิด Path API สาธารณะชุดใหม่","แก้"],
      ["หมอพร้อม (IT)","รับข้อมูลจาก HA.OS แล้วส่ง: ผลทำบัตร (HN / ใช้ HN เดิม / ปฏิเสธ) · เตือนนัด + ลิงก์เช็กอิน · ผลคำขอนัดไม่ต้องส่ง นัดขึ้นในหมอพร้อมเอง (ปฏิเสธ = เจ้าหน้าที่โทรแจ้ง) · ไม่มีหน้าตรวจสถานะ","IT"]]]
  ];
  return `<div class="doc"><h2>ของเดิมที่ต้องปรับ</h2><p class="muted" style="margin:0">รวมจากแผงด้านขวาของทุกหน้าจอ</p>
    <div class="tw"><table><thead><tr><th style="width:28%">ส่วน</th><th>ต้องทำอะไร</th><th style="width:12%">ประเภท</th></tr></thead><tbody>
    ${G.map(([g, rows]) => `<tr class="grp2"><td colspan="3">${g}</td></tr>${rows.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}`).join("")}</tbody></table></div></div>`;
}};

/* ======================= engine ======================= */
let cur = {screen:"s-ticket", params:{}}, scIdx = 0, si = 0, free = false;
const scen = () => free ? null : SC[scIdx];
const sample = () => scen()?.who || SAMPLE_DEFAULT;
const stage = $("#stage");

function navigate(screen, params = {}, silent){
  cur = {screen, params:{...params}};
  render();
  if (!silent) emit("go:" + screen);
}
function rerender(){ render(); }
function render(){
  const s = SCR[cur.screen];
  stage.innerHTML = `<div class="stage-label">${s.label}</div>` + s.render();
  renderChg(); renderGuide();
}
function emit(ev){
  const sc = scen(); if (!sc) return;
  const st = sc.steps[si]; if (!st || st.on !== ev) return;
  si++; afterStep();
}
function afterStep(){
  const st = scen().steps[si];
  st?.enter?.();
  if (st && st.scr !== cur.screen) navigate(st.scr, st.p || {}, true);
  else if (st?.enter) render();
  else renderGuide();
}
function startScenario(i){
  free = false; scIdx = i; si = 0; db = seed(); SC[i].setup?.(db);
  $("#modal-root").innerHTML = "";
  const st = SC[i].steps[0];
  navigate(st.scr, st.p || {}, true); renderNav();
  window.scrollTo({top:0});
}
function startFree(screen){ free = true; $("#modal-root").innerHTML = ""; navigate(screen || "s-ticket", {}, true); renderNav(); }

function renderGuide(){
  const g = $("#guide");
  document.querySelectorAll(".hl").forEach(e => e.classList.remove("hl"));
  if (free){
    g.innerHTML = `<div class="gh"><b>เล่นอิสระ · ${SCR[cur.screen].label}</b></div>
      <p>กดเมนูและปุ่มในหน้าจอได้เลย ข้อมูลเชื่อมกันทุกหน้า เลือกหน้าจอได้จากแถบซ้าย</p>
      <div class="samples"><span>มี HN: 1-1000-00000-01-1 · 12/03/2508 (มีนัดวันนี้)</span><span>1-1000-00000-02-2 · 05/08/2501</span><span>ไม่มี HN: 3-1000-00000-03-3 · 20/01/2540</span></div>
      <div class="gbar"><span style="flex:1"></span><button type="button" class="gb" id="g-reset">ล้างข้อมูลตัวอย่าง</button></div>`;
    $("#g-reset").onclick = () => { db = seed(); cur.params = {}; render(); toast("ล้างข้อมูลแล้ว"); };
    return;
  }
  const sc = scen(), n = sc.steps.length, st = sc.steps[Math.min(si, n - 1)], last = si >= n - 1 && !st.on;
  const chName = CHANNELS.find(c => c[0] === sc.ch)[1];
  g.innerHTML = `<div class="gh"><span class="ch c-${sc.ch}">${chName}</span><b>${sc.id} · ${sc.title}</b><span class="gstep">ขั้น ${Math.min(si + 1, n)}/${n}</span></div>
    <p>${st.t}</p>
    <div class="gbar"><div class="dots">${sc.steps.map((_, i) => `<i class="${i < si ? "done" : i === si ? "now" : ""}"></i>`).join("")}</div>
      <button type="button" class="gb" id="g-restart">เริ่มเคสนี้ใหม่</button>
      <button type="button" class="gb primary" id="g-next">${last ? (scIdx < SC.length - 1 ? "เคสถัดไป ›" : "ดูสรุปของเดิมที่ต้องปรับ ›") : st.on ? "ทำให้ ›" : "ถัดไป ›"}</button></div>`;
  $("#g-restart").onclick = () => startScenario(scIdx);
  $("#g-next").onclick = () => {
    if (last){ if (scIdx < SC.length - 1) startScenario(scIdx + 1); else startFree("doc"); return; }
    if (st.on){ st.prep?.(); if (scen() !== sc || si !== sc.steps.indexOf(st)) return; const el = st.hl && document.querySelector(st.hl); if (el) el.click(); else toast("ทำตามขั้นตอนบนหน้าจอ"); return; }
    si++; afterStep();
  };
  if (st.hl && (!last || !st.on)){
    const el = document.querySelector(st.hl);
    if (el){ el.classList.add("hl"); const r = el.getBoundingClientRect(); if (r.top < 160 || r.bottom > innerHeight) el.scrollIntoView({block:"center", behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
  }
}
function renderChg(){
  const items = CH[cur.screen] || [], lab = {new:"ใหม่", mod:"แก้ของเดิม", reuse:"ใช้ของเดิม"};
  $("#chg").innerHTML = `<h3>หน้านี้ต้องทำอะไร</h3><span class="sub">${SCR[cur.screen].label}</span>
    <div class="legend"><span class="pill new">ใหม่</span><span class="pill mod">แก้ของเดิม</span><span class="pill reuse">ใช้ของเดิม</span></div>
    ${items.map(([k, t]) => `<div class="ci"><span class="pill ${k}">${lab[k]}</span><span>${t}</span></div>`).join("")}
    <button type="button" class="nb doc" data-free="doc">ดูสรุปของเดิมที่ต้องปรับทั้งหมด ›</button>`;
}
function htheme(){ return document.documentElement.dataset.ht || "black"; }
function setTheme(t){ document.documentElement.dataset.ht = t; try { localStorage.setItem("haos-theme", t); } catch (_) {} renderNav(); }
try { const t = localStorage.getItem("haos-theme"); if (t) document.documentElement.dataset.ht = t; } catch (_) {}
function renderNav(){
  const screens = [["counter",[["s-ticket","จองคิว Walk-in"],["s-reg-req","คำขอทำบัตรออนไลน์"],["s-requests","คำขอนัดออนไลน์"],["s-screen","คัดแยก/ซักประวัติ"],["s-limit","สรุปจุดบริการ (ตั้ง Limit)"],["s-samples","ตัวอย่างบัตรคิว Walk-in"]]],["online",[["m-reg-entry","ทำบัตร (หน้ากลาง)"],["m-hn-check","ตรวจสอบ HN"],["m-register","ลงทะเบียนทำบัตร"],["m-request","ขอนัดออนไลน์"],["m-msg","ข้อความเตือนนัด"],["m-checkin","เช็กอินออนไลน์"],["m-resched","แจ้งเลื่อนนัด"],["m-notify","แจ้งผลทางหมอพร้อม (จำลอง)"]]]];
  $("#nav").innerHTML = `<div class="brand"><span class="blogo">HA.OS</span><div><b>ต้นแบบคิวออนไลน์</b><span>ข้อมูลสมมติ · กดได้จริง</span></div></div>
    <div class="themebar">ธีม HA.OS: <button type="button" data-theme-set="black" aria-pressed="${htheme() !== "green"}">ดำ</button><button type="button" class="g" data-theme-set="green" aria-pressed="${htheme() === "green"}">เขียว (ค่าเริ่มต้น NPH)</button></div>
    ${CHANNELS.map(([k, name]) => `<div class="ngrp"><h4><span class="ch c-${k}">${name.split(" · ")[0]}</span>${name.split(" · ")[1]}</h4>${SC.map((s, i) => s.ch === k ? `<button type="button" class="nb ${!free && i === scIdx ? "on" : ""}" data-sc="${i}"><span class="k">${s.id}</span>${s.title}</button>` : "").join("")}</div>`).join("")}
    <div class="sep"></div>
    <div class="ngrp"><h4>เล่นอิสระ · เลือกหน้าจอ</h4>${screens.map(([k, list]) => list.map(([s, n]) => `<button type="button" class="nb ${free && cur.screen === s ? "on" : ""}" data-free="${s}"><span class="k">${k === "counter" ? "จนท." : k === "kiosk" ? "ตู้" : "มือถือ"}</span>${n}</button>`).join("")).join("")}</div>
    <div class="sep"></div>
    <button type="button" class="nb doc ${free && cur.screen === "doc" ? "on" : ""}" data-free="doc">สรุป: ของเดิมที่ต้องปรับ</button>`;
}

/* event delegation */
stage.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ let p = {}; try { p = g.dataset.p ? JSON.parse(g.dataset.p) : {}; } catch (_) {} navigate(g.dataset.go, p); if (free) renderNav(); return; }
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled) SCR[cur.screen].act?.(a.dataset.act, a, e);
});
stage.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-act]")){ e.preventDefault(); e.target.click(); } });
stage.addEventListener("change", e => SCR[cur.screen].change?.(e.target));
stage.addEventListener("input", e => SCR[cur.screen].input?.(e.target));
document.addEventListener("click", e => {
  const th = e.target.closest("[data-theme-set]"); if (th) return setTheme(th.dataset.themeSet);
  const s = e.target.closest("[data-sc]"); if (s) return startScenario(+s.dataset.sc);
  const f = e.target.closest("[data-free]"); if (f) return startFree(f.dataset.free);
});

startScenario(0);
</script>
